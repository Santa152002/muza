<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174d38">
  <meta name="description" content="Залишай відгук з коментарем — отримуй подарунок до наступного замовлення. МУЗА від Євгена Клопотенка.">
  <title>МУЗА — подарунок за відгук</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #f8f5ea; color: #174d38; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; }
    main { min-height: 100svh; max-width: 760px; margin: auto; padding: 36px 26px 48px; display: flex; flex-direction: column; }
    .brand { text-align: center; }
    .brand-name { display: block; font-weight: 900; font-size: 36px; letter-spacing: -2px; line-height: 1; }
    .brand-byline { display: block; font-size: 12px; margin-top: 9px; }
    .message { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 44px 0 24px; }
    .gift { font-size: 56px; line-height: 1; margin-bottom: 28px; }
    h1 { font-size: clamp(32px, 7vw, 52px); line-height: 1.1; font-weight: 800; letter-spacing: -1.4px; max-width: 620px; margin: 0; text-wrap: balance; }
    .reward { font-size: clamp(25px, 5.6vw, 38px); line-height: 1.23; font-weight: 500; letter-spacing: -.6px; max-width: 560px; margin: 28px 0 0; text-wrap: balance; }
    .reward strong { color: #b84c26; font-weight: 800; }
    @media (min-width: 700px) { main { padding-top: 50px; padding-bottom: 70px; } }
    @media (max-width: 350px) { main { padding-left: 18px; padding-right: 18px; } h1 { font-size: 30px; } }
  </style>
</head>
<body>
  <main>
    <header class="brand" aria-label="МУЗА від Євгена Клопотенка">
      <span class="brand-name">МУЗА</span>
      <span class="brand-byline">від Євгена Клопотенка</span>
    </header>
    <section class="message" aria-labelledby="message-title">
      <div class="gift" aria-hidden="true">🎁</div>
      <h1 id="message-title">Залишай відгук з коментарем</h1>
      <p class="reward">— отримуй <strong>подарунок</strong> до наступного замовлення</p>
    </section>
  </main>
</body>
</html>
