<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#332014">
  <meta name="description" content="Залишай відгук з коментарем — отримуй подарунок до наступного замовлення. МУЗА від Євгена Клопотенка.">
  <title>МУЗА — подарунок за відгук</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html { background: #332014; color: #fff7e7; }
    body { margin: 0; font-family: 'Rubik', Arial, sans-serif; }
    main { position: relative; isolation: isolate; width: min(100%, 560px); min-height: 100svh; aspect-ratio: 9 / 16; margin: auto; overflow: hidden; display: flex; flex-direction: column; }
    .background { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; z-index: -2; }
    main::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom, rgba(30,17,8,.6), rgba(30,17,8,.54) 32%, rgba(30,17,8,.12) 49%, transparent 59%); }
    .content { padding: 28px 24px 0; text-align: center; }
    .logo { display: block; width: 78%; max-width: 350px; height: auto; margin: 0 auto; filter: brightness(0) invert(1); }
    h1, p { text-transform: uppercase; text-wrap: balance; text-shadow: 0 2px 10px rgba(0,0,0,.45); }
    h1 { font-size: clamp(25px, 6.6vw, 38px); line-height: 1.17; font-weight: 900; margin: 25px 0 0; }
    p { font-size: clamp(19px, 4.9vw, 28px); line-height: 1.3; font-weight: 800; margin: 18px 0 0; }
    .action { margin-top: auto; padding: 80px 24px max(28px, env(safe-area-inset-bottom)); text-align: center; }
    .review-link { display: inline-flex; align-items: center; justify-content: space-between; gap: 24px; width: min(100%, 310px); min-height: 62px; padding: 10px 12px 10px 28px; border: 1px solid rgba(255,240,198,.9); border-radius: 999px; background: linear-gradient(120deg, rgba(255,255,255,.32), transparent 46%), linear-gradient(105deg, #f9df9e 0%, #edbf69 48%, #c68a35 100%); color: #39230e; font-size: 22px; font-weight: 800; text-decoration: none; box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(103,57,9,.16), 0 10px 28px rgba(25,12,3,.48); transition: transform .18s ease, box-shadow .18s ease; }
    .review-link .label { flex: 1; text-align: center; }
    .review-link .arrow { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: rgba(255,250,227,.38); border: 1px solid rgba(255,248,223,.48); font-family: Arial, sans-serif; font-size: 25px; }
    .review-link:hover { transform: translateY(-2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 13px 32px rgba(25,12,3,.55); }
    .review-link:active { transform: translateY(0); }
    .review-link:focus-visible { outline: 3px solid white; outline-offset: 5px; }
    @media (prefers-reduced-motion: reduce) { .review-link { transition: none; } }
    @media (max-width: 350px) { .content { padding: 20px 18px 0; } h1 { margin-top: 20px; } p { margin-top: 14px; } }
    @media (min-width: 700px) { .content { padding-top: 36px; } }
  </style>
</head>
<body>
  <main>
    <img class="background" src="assets/muza-autumn-portrait.png" alt="" fetchpriority="high">
    <div class="content">
      <img class="logo" src="assets/muza-logo.png" width="4344" height="1448" alt="МУЗА від Євгена Клопотенка">
      <h1>Залишай відгук<br>з коментарем</h1>
      <p>— отримуй подарунок<br>до наступного замовлення <span aria-label="сердечко">❤️</span></p>
    </div>
    <div class="action">
      <a class="review-link" href="https://glovo.go.link/open?link_type=store&amp;store_id=497598&amp;adjust_t=s321jkn"><span class="label">Відгук</span><span class="arrow" aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
