<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5e8">
  <meta name="description" content="Залишай відгук з коментарем — отримуй подарунок до наступного замовлення. МУЗА від Євгена Клопотенка.">
  <title>МУЗА — подарунок за відгук</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html { background: #f8f5e8; color: #805c20; }
    body { margin: 0; font-family: 'Rubik', Arial, sans-serif; }
    .page { position: relative; isolation: isolate; min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
    .texture { position: absolute; z-index: -1; inset: 0; overflow: hidden; }
    .texture span { display: block; height: 100px; background-image: url('assets/muza-pattern.png'); background-size: min(100vw, 760px) auto; background-position: center calc(-1 * min(25vw, 190px)); }
    .ornament { flex: none; width: 100%; height: clamp(78px, 20vw, 150px); background-image: url('assets/muza-pattern.png'); background-size: min(100vw, 760px) auto; background-position: center top; background-repeat: repeat-x; }
    .ornament-bottom { background-position: center bottom; }
    main { width: 100%; max-width: 760px; margin: auto; padding: 24px 26px 42px; flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .logo { display: block; width: min(100%, 400px); height: auto; }
    .message { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 34px 0 30px; }
    h1, p { text-transform: uppercase; text-wrap: balance; }
    h1 { font-size: clamp(30px, 7.8vw, 52px); line-height: 1.16; font-weight: 900; letter-spacing: .01em; margin: 0; }
    p { font-size: clamp(23px, 5.9vw, 36px); line-height: 1.27; font-weight: 800; margin: 28px 0 0; }
    @media (max-height: 600px) { main { padding-top: 12px; padding-bottom: 20px; } .logo { width: 240px; } .message { padding: 20px 0; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="texture" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="ornament" aria-hidden="true"></div>
    <main>
      <img class="logo" src="assets/muza-logo.png" width="4344" height="1448" alt="МУЗА від Євгена Клопотенка">
      <section class="message" aria-labelledby="message-title">
        <h1 id="message-title">Залишай відгук<br>з коментарем</h1>
        <p>— отримуй подарунок<br>до наступного замовлення</p>
      </section>
    </main>
    <div class="ornament ornament-bottom" aria-hidden="true"></div>
  </div>
</body>
</html>
